name: Build Garage Log APK
on:
  push:
    branches: [carlog-app]
    paths:
      - 'carlog/**'
      - '.github/workflows/carlog-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: carlog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Keep signing key for updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: garage-log-signing-v1
      - run: gradle --no-daemon lintRelease assembleRelease
      - run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GarageLog-APK
          path: carlog/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error
