plugins { id 'com.android.application' }
android {
    namespace 'com.stevenris.reader'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.stevenris.reader'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }
    buildTypes {
        release {
            // Personal sideload build: same locally generated certificate as v1,
            // but without the debuggable flag. No signing keys in source/artifacts.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
