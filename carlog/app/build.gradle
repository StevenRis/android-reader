plugins { id 'com.android.application' }
android {
    namespace 'com.stevenris.garagelog'
    compileSdk 35
    defaultConfig {
        applicationId 'com.stevenris.garagelog'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
